name: LaLetra CRM & Store - Automated Tests & Quality Assurance

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configure single-package workspace for pnpm 9
        run: |
          if [ -f pnpm-workspace.yaml ] && ! grep -q "^packages:" pnpm-workspace.yaml; then
            printf "packages:\n  - '.'\n\n%s\n" "$(cat pnpm-workspace.yaml)" > pnpm-workspace.yaml
          fi

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static Analysis (Oxlint)
        run: pnpm oxlint src

      - name: TypeScript Typecheck (tsc)
        run: pnpm tsc --noEmit

      - name: Vitest Automated Test Suite (Full Execution)
        run: pnpm vitest run --reporter=verbose

      - name: Frontend Build Verification (Vite)
        run: pnpm run build
